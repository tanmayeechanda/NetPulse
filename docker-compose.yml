services:
  backend:
    build: ./backend
    container_name: netpulse-backend
    # Host networking lets scapy see real interfaces for ARP scans and packet capture.
    # The API is served directly on host port 8000 (a `ports:` mapping is not used with host mode).
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - LOG_LEVEL=INFO
      # - NETPULSE_SUBNET=192.168.1.0/24   # override auto-detected subnet
      # - NETPULSE_IFACE=eth0              # interface to sniff on
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The browser talks to the API directly, so use an address reachable from your machine.
        VITE_API_URL: http://localhost:8000
    container_name: netpulse-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
